<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>PyLearn — Learn Python by Doing</title>
  <meta name="description" content="PyLearn is an interactive place to learn Python with lessons, coding practice, and challenges. Open the learning platform.">
  <link rel="icon" type="image/png" sizes="1254x1254" href="https://yabu528.github.io/Pylearn/assets/pylearn-logo-dark.png">
  <link rel="apple-touch-icon" href="https://yabu528.github.io/Pylearn/assets/pylearn-logo-dark.png">
  <link rel="canonical" href="https://yabu528.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PyLearn">
  <meta property="og:title" content="PyLearn — Learn Python by Doing">
  <meta property="og:description" content="Learn Python through interactive lessons, coding practice, and challenges.">
  <meta property="og:url" content="https://yabu528.github.io/">
  <meta property="og:image" content="https://yabu528.github.io/Pylearn/assets/pylearn-logo-dark.png">
  <meta property="og:image:alt" content="PyLearn logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PyLearn — Learn Python by Doing">
  <meta name="twitter:description" content="Interactive Python lessons, coding practice, and challenges.">
  <meta name="twitter:image" content="https://yabu528.github.io/Pylearn/assets/pylearn-logo-dark.png">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101827; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 18px; background: radial-gradient(ellipse at 50% 0%, #1c3150 0%, #101827 58%); }
    main { width: min(100%, 680px); text-align: center; padding: 44px 28px; border: 1px solid #2b3a50; border-radius: 24px; background: rgba(17, 29, 46, .88); box-shadow: 0 24px 80px rgba(0,0,0,.28); }
    .logo { display: block; width: 104px; height: 104px; object-fit: contain; margin: 0 auto 26px; border-radius: 22px; }
    .eyebrow { margin: 0 0 12px; color: #8eb8ff; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -.045em; line-height: 1.08; }
    .intro { max-width: 490px; margin: 18px auto 30px; color: #b8c5d6; font-size: 1.08rem; line-height: 1.7; }
    .cta { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 0 26px; border-radius: 12px; background: #3478f6; color: white; font-weight: 700; text-decoration: none; transition: background .18s ease, transform .18s ease; }
    .cta:hover { background: #4b8aff; transform: translateY(-1px); }
    .note { margin: 22px 0 0; color: #8292a8; font-size: .88rem; }
    @media (max-width: 480px) { main { padding: 36px 20px; } .logo { width: 88px; height: 88px; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="https://yabu528.github.io/Pylearn/assets/pylearn-logo-dark.png" alt="PyLearn logo" width="1254" height="1254">
    <p class="eyebrow">Interactive Python learning</p>
    <h1>Learn Python by doing.</h1>
    <p class="intro">Build your Python skills with guided lessons, hands-on coding practice, and challenges — all in one learning platform.</p>
    <a class="cta" href="https://yabu528.github.io/Pylearn/">Open PyLearn</a>
    <p class="note">Your next step in learning Python starts here.</p>
  </main>
</body>
</html>
